name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make CC=${{ matrix.cc }}
      - name: Test (compare with libc printf)
        run: make test CC=${{ matrix.cc }}
      - name: Test with AddressSanitizer / UBSan
        if: matrix.cc == 'gcc'
        run: |
          ${{ matrix.cc }} -g -fsanitize=address,undefined -fno-sanitize-recover=all \
            -Wall -Wextra -Werror -Iinclude \
            tests/*.c srcs/*.c $(find libft/src -name '*.c') -o test_sanitize
          ./test_sanitize

  norminette:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install norminette
        run: python -m pip install norminette==3.3.60
      - name: Run norminette (whole repository, including tests)
        run: norminette
